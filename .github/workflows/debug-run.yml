name: debug-run

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test notification
        run: python official_watch.py --test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Debug all ryokans
        run: python official_watch.py --debug 2>&1 | tee debug_log.txt
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-output
          path: |
            debug_log.txt
            debug_*.png
            debug_*.html
